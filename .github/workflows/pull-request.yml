# The organisation's PR conventions (Conventional Commit title, label from it), from this repository's own
# reusable workflow. Other repositories call it at a version tag.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-conventions.yml
