# The organisation's PR conventions (Conventional Commit title, label from it), from this repository's own
# reusable workflow (`$/`: GitHub's recommended same-repository syntax). Other repositories call it at a version tag.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
      security-events: write # zizmor's SARIF upload
    uses: $/.github/workflows/pr-conventions.yml
