# Reusable: the PR title is a Conventional Commit (it becomes the squash commit, the label and the changelog
# line), and the PR gets its label from that title. Called by every repository's pull-request.yml; the
# `title` job is a required check (ruleset "Protect main").
#
# Types: the Conventional Commits set of commitlint's config-conventional. A breaking change adds `!`.
# Labels: the autolabeler rules of .github/release-drafter.yml in this repository.
# Lint: zizmor (security, Security tab + ruleset gate) and actionlint (syntax, shellcheck, annotations, blocking).
name: PR conventions

on:
  workflow_call:

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test

  # A PR from a fork gets a read-only token: no label there (the title check still runs).
  label:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

  # The caller's .github/workflows/, checked out here (the github context is the caller's).
  # zizmor in its documented Advanced Security mode: findings go to the Security tab as SARIF (the job does not
  # fail on them); the ruleset's code_scanning rule, tool `zizmor`, blocks the merge. actionlint through its
  # official image pinned by digest (shellcheck included), errors as GitHub annotations through its problem matcher.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor's SARIF goes to code scanning on the PR's HEAD commit (ref refs/pull/N/head, like CodeQL default
      # setup), not on the test-merge commit a pull_request run checks out: the rulesets' code_scanning rule looks
      # for results on the head or the *current* merge commit, and the merge commit changes, so an upload on it
      # left every PR "waiting for results from zizmor". Official image, pinned by digest; any exit code with a
      # SARIF written is a result (zizmor exits non-zero when it finds something).
      - name: zizmor
        run: |
          docker run --rm -v "$PWD:/repo"             ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d             --no-progress --no-online-audits --format sarif /repo > zizmor.sarif || true
          python3 -c 'import json,sys; json.load(open("zizmor.sarif"))' || { echo "::error::zizmor produced no SARIF"; exit 1; }
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # Errors become annotations through actionlint's official problem matcher (its repository's
      # .github/actionlint-matcher.json at v1.7.12, embedded: the checkout is the caller's). The one ignore:
      # `$/` is GitHub's recommended same-repository syntax, which actionlint 1.7.12 does not parse yet.
      - name: actionlint
        run: |
          cat > "$RUNNER_TEMP/actionlint-matcher.json" <<'EOF'
          {"problemMatcher": [{"owner": "actionlint", "pattern": [{"regexp": "^(?:\\x1b\\[\\d+m)?(.+?)(?:\\x1b\\[\\d+m)*:(?:\\x1b\\[\\d+m)*(\\d+)(?:\\x1b\\[\\d+m)*:(?:\\x1b\\[\\d+m)*(\\d+)(?:\\x1b\\[\\d+m)*: (?:\\x1b\\[\\d+m)*(.+?)(?:\\x1b\\[\\d+m)* \\[(.+?)\\]$", "file": 1, "line": 2, "column": 3, "message": 4, "code": 5}]}]}
          EOF
          echo "::add-matcher::$RUNNER_TEMP/actionlint-matcher.json"
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color -ignore 'reusable workflow call "\$/'
