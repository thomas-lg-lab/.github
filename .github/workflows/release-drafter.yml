# Reusable: keeps a draft GitHub Release up to date from the merged PRs (categories and version from their labels,
# .github/release-drafter.yml in this repository), and publishes it on demand. Publishing creates the `v*` tag as
# the organisation's release App (`thomas-lg-release`, Contents write only): the only actor the "Release tags"
# ruleset lets create such a tag, and a tag it pushes starts the repository's workflows (a GITHUB_TOKEN tag would
# not), so `ci.yml` builds the release image on its own `push: tags` trigger.
# Called by the release-drafter.yml workflow of every repository that ships releases with `secrets: inherit` (the
# organisation secrets RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY).
name: Release Drafter

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the draft (creates the tag) instead of refreshing it.
        type: boolean
        default: false
      dry-run:
        description: With publish, log what would be published and change nothing.
        type: boolean
        default: false

permissions: {}

jobs:
  draft:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    # Two quick pushes to main would race on the same draft (the caller's concurrency group is its own).
    concurrency:
      group: release-drafter-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # create and update the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Only main is released
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::A release is published from main, not from $GITHUB_REF_NAME."
          exit 1
      # The release App's token, scoped to this repository and to Contents write: it publishes the release and
      # creates the tag (the ruleset's bypass actor), and that tag starts ci.yml.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          dry-run: ${{ inputs.dry-run }}
          token: ${{ steps.app-token.outputs.token }}
