# Reusable: builds the repository's Docker image, gates it, and publishes it to GHCR. Called as the last job of a
# repository's CI (after its tests, with `needs:`), so nothing is published that did not pass them.
#
# Merging is not releasing:
#   - pull request: build amd64, scan, no push (and an arm64 build on an arm runner with verify-arm64)
#   - push to main: publishes :edge and :sha-<short>
#   - v* tag (a published release; the release App's tag push starts this workflow): publishes :X.Y.Z / :X.Y / :X,
#     and :latest unless it is a pre-release (latest=auto).
# The image is ghcr.io/<owner>/<repo>; the Dockerfile's VERSION build argument receives the image version.
#
# The caller grants contents read and security-events write (Trivy report), and for publishing packages write,
# id-token write and attestations write.
name: Container image

on:
  workflow_call:
    inputs:
      context:
        description: Build context.
        type: string
        default: "."
      file:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      platforms:
        description: Platforms published.
        type: string
        default: linux/amd64,linux/arm64
      verify-arm64:
        description: On pull requests, also build the arm64 image on an arm runner (catches arm-only failures).
        type: boolean
        default: false
      contract-test:
        description: >-
          Run the lab runtime contract test on the built image, before the vulnerability gate: non-root user set in
          the image, HTTP on 8080 with an empty /data and /secrets and a read-only root filesystem, GET /healthz 200,
          a page answers with an injected Remote-User, logs on stdout, clean stop within 10 s of SIGTERM. The two
          inputs below adapt it to an app with its own login or with a database.
        type: boolean
        default: false
      contract-protected-path:
        description: >-
          Contract test, login variant: for an app that signs its users in itself, a path only a signed-in user may
          read (for example /api/v1/me). It must answer 401, 403 or a redirect, without a session and with forged
          Remote-User, Remote-Groups and Remote-Email headers alike. Replaces the page check with a Remote-User.
        type: string
        default: ""
      contract-database-path:
        description: >-
          Contract test, database variant: for an app with a PostgreSQL database, a path that reads it (for example
          /api/v1/config). The connection string is the file /secrets/database-url, a postgresql:// URI of a user
          that owns its database and nothing else. /healthz must answer 200 and this path 5xx with no connection
          string, then with an unreachable database; once the database is up the path must stop answering 5xx
          within 60 s, the app not restarted.
        type: string
        default: ""

permissions: {}

jobs:
  # The gate every event runs: build amd64, load it, report CRITICAL and HIGH to the Security tab, fail on a fixable
  # CRITICAL only (HIGHs churn with the vulnerability database and would wedge releases on base-image findings).
  # Without a Dockerfile (a template, a repository that ships no image) every step is skipped and the check passes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      dockerfile: ${{ steps.detect.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image names are lowercase: metadata-action lowercases on its own, Trivy and the attestation get this value.
      - id: detect
        env:
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.file }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -f "$DOCKERFILE" ]; then echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No $DOCKERFILE, nothing to build."; echo "dockerfile=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.detect.outputs.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
      # amd64 only: `load` takes one platform, and both architectures install the same packages.
      - name: Build (no push)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs the image the way the lab cluster does (uid 10001, read-only root, /tmp as tmpfs, empty volumes), then,
      # for the database variant, a second time with its connection string and a PostgreSQL that comes up late.
      - name: Runtime contract test
        if: inputs.contract-test && steps.detect.outputs.dockerfile == 'true'
        env:
          IMAGE: ${{ steps.detect.outputs.image }}:${{ steps.meta.outputs.version }}
          PROTECTED_PATH: ${{ inputs.contract-protected-path }}
          DATABASE_PATH: ${{ inputs.contract-database-path }}
          # PostgreSQL 18 with pgvector, as the lab's database image has it.
          # renovate: datasource=docker depName=pgvector/pgvector
          POSTGRES_IMAGE: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        run: |
          set -u
          fail() { echo "::error title=Runtime contract::$1"; docker logs contract 2>&1 | tail -20 || true; exit 1; }
          # code <path> [curl options]: the HTTP status of a GET, 000 when nothing answers.
          code() { local path=$1; shift; curl -s -o /dev/null -m 10 -w '%{http_code}' "$@" "http://127.0.0.1:18080$path" || true; }
          start_app() {
            docker run -d --name contract --user 10001:10001 --read-only --tmpfs /tmp \
              -v "$data:/data" -v "$secrets:/secrets:ro" -p 127.0.0.1:18080:8080 "$@" "$IMAGE" > /dev/null
            for _ in $(seq 1 30); do [ "$(code /healthz)" = 200 ] && return; sleep 1; done
            fail "GET /healthz on 8080 did not answer 200 within 30 s"
          }
          stop_app() {
            [ -n "$(docker logs contract 2>&1)" ] || fail "nothing logged on stdout or stderr"
            local start status
            start=$(date +%s)
            docker stop -t 10 contract > /dev/null
            took=$(( $(date +%s) - start ))
            status=$(docker inspect --format '{{.State.ExitCode}}' contract)
            [ "$status" != 137 ] && [ "$took" -lt 10 ] || fail "no clean stop on SIGTERM (exit $status after ${took} s)"
            docker rm contract > /dev/null
          }
          # Default: the reverse proxy's Remote-User names the user. Login variant: it must name nobody.
          check_user() {
            local plain forged
            if [ -z "$PROTECTED_PATH" ]; then
              plain=$(code / -H 'Remote-User: contract-test')
              case "$plain" in 2??) ;; *) fail "GET / with a Remote-User header answered $plain" ;; esac
              summary="$summary, / $plain with Remote-User"
              return
            fi
            plain=$(code "$PROTECTED_PATH")
            forged=$(code "$PROTECTED_PATH" -H 'Remote-User: contract-test' -H 'Remote-Groups: admins' \
              -H 'Remote-Email: contract-test@example.org')
            case "$plain" in 401|403|3??) ;; *) fail "GET $PROTECTED_PATH without a session answered $plain" ;; esac
            case "$forged" in 401|403|3??) ;; *) fail "GET $PROTECTED_PATH with forged Remote-* headers answered $forged" ;; esac
            summary="$summary, $PROTECTED_PATH $plain without a session and $forged with forged Remote-* headers"
          }
          for path in "$PROTECTED_PATH" "$DATABASE_PATH"; do
            case "$path" in ""|/*) ;; *) fail "a contract path must start with / ('$path')" ;; esac
          done
          user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE")
          case "${user%%:*}" in ""|0|root) fail "the image sets no non-root USER (Config.User='$user')" ;; esac
          summary="user $user"

          # 1. Empty /data, empty /secrets.
          data=$(mktemp -d) && secrets=$(mktemp -d) && chmod 0777 "$data" && chmod 0755 "$secrets"
          start_app
          summary="$summary, /healthz 200"
          if [ -z "$DATABASE_PATH" ]; then
            check_user
          else
            got=$(code "$DATABASE_PATH")
            case "$got" in 5??) ;; *) fail "GET $DATABASE_PATH with no connection string answered $got, not 5xx" ;; esac
          fi
          stop_app
          summary="$summary, logs on stdout, stopped in ${took} s"

          # 2. Database variant: the connection string as the lab mounts it, the database not there yet.
          if [ -n "$DATABASE_PATH" ]; then
            docker network create contract > /dev/null
            password=$(openssl rand -hex 16)
            printf 'postgresql://app:%s@contract-db:5432/app' "$password" > "$secrets/database-url"
            chmod 0444 "$secrets/database-url"
            start_app --network contract
            got=$(code "$DATABASE_PATH")
            case "$got" in 5??) ;; *) fail "GET $DATABASE_PATH with an unreachable database answered $got, not 5xx" ;; esac
            [ "$(code /healthz)" = 200 ] || fail "GET /healthz no longer answers 200 once the database was asked for"
            summary="$summary; database unreachable: /healthz 200, $DATABASE_PATH $got"

            # As on the lab: the app's user owns its database and is no superuser.
            docker run -d --name contract-db --network contract -e POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
              "$POSTGRES_IMAGE" > /dev/null
            for _ in $(seq 1 60); do
              docker exec contract-db pg_isready -q -h 127.0.0.1 -U postgres && break
              sleep 1
            done
            docker exec contract-db psql -q -v ON_ERROR_STOP=1 -U postgres \
              -c "CREATE ROLE app LOGIN PASSWORD '$password'" -c "CREATE DATABASE app OWNER app" \
              || fail "the test's PostgreSQL did not start (not the app's fault)"
            start=$(date +%s)
            for _ in $(seq 1 60); do
              got=$(code "$DATABASE_PATH")
              case "$got" in 000|5??) sleep 1 ;; *) break ;; esac
            done
            case "$got" in 000|5??) fail "GET $DATABASE_PATH still answers $got 60 s after the database came up" ;; esac
            summary="$summary; database up: $DATABASE_PATH $got after $(( $(date +%s) - start )) s"
            check_user
            stop_app
          fi
          echo "Runtime contract: $summary."
      - name: Vulnerability report (Trivy)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.detect.outputs.image }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload the report to code scanning
        if: always() && steps.detect.outputs.dockerfile == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Vulnerability gate (Trivy)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.detect.outputs.image }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  # In parallel with `build`, so it detects the Dockerfile itself.
  build-arm64:
    if: ${{ inputs.verify-arm64 && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        env:
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.file }}
        run: echo "dockerfile=$([ -f "$DOCKERFILE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build arm64 (no push)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/arm64
          push: false
          # Its own cache scope: sharing the amd64 one would have each eviction take the other's layers.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # Only main and v* tags publish (a manual run on another ref would have no tag to push), once the gate passed.
  # The only job holding packages, id-token and attestations write.
  publish:
    needs: build
    if: ${{ needs.build.outputs.dockerfile == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for the build-provenance attestation
      attestations: write
    steps:
      # Which commit a v* tag points at is the "Release tags" ruleset's business (only the release App and an admin
      # create one, from Release Drafter's draft of main), not this workflow's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The sha tag is published from main only: a tag build would push it again from a second build and move a tag
      # meant to be immutable.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
      - id: push
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
      # Verifiable with: gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
