# Reusable: builds the repository's Docker image, gates it, and publishes it to GHCR. Called as the last job of a
# repository's CI (after its tests, with `needs:`), so nothing is published that did not pass them.
#
# Merging is not releasing:
#   - pull request: build amd64, scan, no push (and an arm64 build on an arm runner with verify-arm64)
#   - push to main: publishes :edge and :sha-<short>
#   - v* tag (a published release; the release App's tag push starts this workflow): publishes :X.Y.Z / :X.Y / :X,
#     and :latest unless it is a pre-release (latest=auto). The tagged commit must be on main.
# The image is ghcr.io/<owner>/<repo>; the Dockerfile's VERSION build argument receives the image version.
#
# The caller grants contents read and security-events write (Trivy report), and for publishing packages write,
# id-token write and attestations write.
name: Container image

on:
  workflow_call:
    inputs:
      context:
        description: Build context.
        type: string
        default: "."
      file:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      platforms:
        description: Platforms published.
        type: string
        default: linux/amd64,linux/arm64
      verify-arm64:
        description: On pull requests, also build the arm64 image on an arm runner (catches arm-only failures).
        type: boolean
        default: false

permissions: {}

jobs:
  # The gate every event runs: build amd64, load it, report CRITICAL and HIGH to the Security tab, fail on a fixable
  # CRITICAL only (HIGHs churn with the vulnerability database and would wedge releases on base-image findings).
  # Without a Dockerfile (a template, a repository that ships no image) every step is skipped and the check passes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      dockerfile: ${{ steps.detect.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image names are lowercase: metadata-action lowercases on its own, Trivy and the attestation get this value.
      - id: detect
        env:
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.file }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -f "$DOCKERFILE" ]; then echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No $DOCKERFILE, nothing to build."; echo "dockerfile=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.detect.outputs.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
      # amd64 only: `load` takes one platform, and both architectures install the same packages.
      - name: Build (no push)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability report (Trivy)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.detect.outputs.image }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload the report to code scanning
        if: always() && steps.detect.outputs.dockerfile == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Vulnerability gate (Trivy)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.detect.outputs.image }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  # In parallel with `build`, so it detects the Dockerfile itself.
  build-arm64:
    if: ${{ inputs.verify-arm64 && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        env:
          DOCKERFILE: ${{ inputs.context }}/${{ inputs.file }}
        run: echo "dockerfile=$([ -f "$DOCKERFILE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build arm64 (no push)
        if: steps.detect.outputs.dockerfile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/arm64
          push: false
          # Its own cache scope: sharing the amd64 one would have each eviction take the other's layers.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # Only main and v* tags publish (a manual run on another ref would have no tag to push), once the gate passed.
  # The only job holding packages, id-token and attestations write.
  publish:
    needs: build
    if: ${{ needs.build.outputs.dockerfile == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A tag build needs main's history for the check below. Strings, because a bare 0 is falsy.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
      # Anyone with write access can push a v* tag on any commit: only a commit of main becomes a release image.
      - name: Check the tagged commit is on main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main, refusing to publish it."
            exit 1
          fi
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The sha tag is published from main only: a tag build would push it again from a second build and move a tag
      # meant to be immutable.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
      - id: push
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
      # Verifiable with: gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
